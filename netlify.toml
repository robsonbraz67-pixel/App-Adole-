[build]
  command = "npm run build"
  publish = "dist"
  # Produção (branch main) só builda quando o commit tem [deploy] — protege
  # créditos e evita deploy acidental. (ignore: sai 0 = pula build, ≠0 = builda)
  ignore = "! git log -1 --pretty=%B | grep -qF '[deploy]'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Deploy previews (PRs) e branch deploys SEMPRE buildam, para testar antes de ir
# pra produção — sem precisar de [deploy] no commit. Produção segue protegida.
[context.deploy-preview]
  ignore = "false"

[context.branch-deploy]
  ignore = "false"

# ===== Cache: o que trava versão antiga no navegador =====
# Os arquivos de /assets já têm hash no nome, então nunca mudam de conteúdo —
# podem ser guardados para sempre. Já o index.html é o que APONTA para eles: se
# ele vier do cache, o navegador carrega o bundle antigo mesmo com deploy novo.
# version.json precisa ser sempre fresco, senão o aviso de atualização não chega.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# Ícones e manifest não têm hash no nome, então "immutable" seria errado — mas
# sem header nenhum o navegador revalida os 5 a cada abertura do app instalado.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
