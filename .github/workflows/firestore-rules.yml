name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
      - 'tests/rules/**'
      - 'scripts/check-rules-functions.mjs'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'tests/rules/**'
      - 'scripts/check-rules-functions.mjs'
  workflow_dispatch: {}

jobs:
  # Regra quebrada falha em SILÊNCIO em produção (ver o apagão de 2026-07-25
  # documentado em firestore.rules). Este job é o que impede isso de ser
  # publicado: o deploy abaixo só roda se ele passar.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O emulador do Firestore roda em Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Checar função indefinida nas regras
        run: npm run check:rules

      # Testes que não precisam de emulador (a decisão do backfill de turmas).
      # Rodam junto porque o job já está de pé; um push que mexa SÓ na função
      # não dispara este workflow — nesse caso, rodar `npm run test:unit` local.
      - name: Testes unitários
        run: npm run test:unit

      - name: Testar as regras no emulador
        run: npm run test:rules

  deploy-rules:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Usa o firebase-tools fixado no package.json, não @latest: o deploy de
      # regras não pode mudar de comportamento sozinho quando sai versão nova.
      # Índices junto das regras: uma consulta sem índice falha em PRODUÇÃO
      # (não degrada, falha), então o índice precisa existir antes do código
      # que consulta. Publicar os dois pelo mesmo caminho evita a ordem errada.
      # O índice leva alguns minutos construindo depois de aceito — conferir em
      # `npx firebase firestore:indexes` antes de subir código que dependa dele.
      - name: Deploy Firestore rules e índices
        run: npx firebase deploy --only firestore:rules,firestore:indexes --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
