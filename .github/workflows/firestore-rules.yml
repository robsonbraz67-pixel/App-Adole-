name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
      - 'tests/rules/**'
      - 'scripts/check-rules-functions.mjs'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'tests/rules/**'
      - 'scripts/check-rules-functions.mjs'
  workflow_dispatch: {}

jobs:
  # Regra quebrada falha em SILÊNCIO em produção (ver o apagão de 2026-07-25
  # documentado em firestore.rules). Este job é o que impede isso de ser
  # publicado: o deploy abaixo só roda se ele passar.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O emulador do Firestore roda em Java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Checar função indefinida nas regras
        run: npm run check:rules

      # Testes que não precisam de emulador (a decisão do backfill de turmas).
      # Rodam junto porque o job já está de pé; um push que mexa SÓ na função
      # não dispara este workflow — nesse caso, rodar `npm run test:unit` local.
      - name: Testes unitários
        run: npm run test:unit

      - name: Testar as regras no emulador
        run: npm run test:rules

  deploy-rules:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Usa o firebase-tools fixado no package.json, não @latest: o deploy de
      # regras não pode mudar de comportamento sozinho quando sai versão nova.
      #
      # Conta de serviço em vez de `--token` (que está DEPRECADO no
      # firebase-tools e ia sumir numa versão maior). O mesmo segredo
      # FIREBASE_SERVICE_ACCOUNT é usado aqui, no Hosting
      # (.github/workflows/hosting.yml) e nos backfills
      # (.github/workflows/backfill-*.yml) — GOOGLE_APPLICATION_CREDENTIALS
      # precisa ser um ARQUIVO, não a variável com o JSON direto.
      #
      # ⚠️ Este passo só funciona depois que o segredo FIREBASE_SERVICE_ACCOUNT
      # existir no repositório (gerado no Console do Firebase > Configurações
      # > Contas de serviço > gerar chave, e salvo com
      # `gh secret set FIREBASE_SERVICE_ACCOUNT < chave.json`). Sem o segredo,
      # este passo falha e nenhuma regra sobe — confirme que ele existe antes
      # de mesclar esta mudança em main.
      #
      # Índices junto das regras: uma consulta sem índice falha em PRODUÇÃO
      # (não degrada, falha), então o índice precisa existir antes do código
      # que consulta. Publicar os dois pelo mesmo caminho evita a ordem errada.
      # O índice leva alguns minutos construindo depois de aceito — conferir em
      # `npx firebase firestore:indexes` antes de subir código que dependa dele.
      - name: Escrever credencial da conta de serviço
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy Firestore rules e índices
        run: npx firebase deploy --only firestore:rules,firestore:indexes --non-interactive --project gen-lang-client-0268878137
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
