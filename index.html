<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0A1230">
    <title>SabatinaQuest ✨</title>

    <!-- Instalação como app.
         Android/Chrome usa o manifest (precisa de ícone 192 e 512 e
         display:standalone para oferecer "Instalar"). O iOS ignora o
         manifest e lê estas metatags: sem o apple-touch-icon, o atalho
         criado pelo Safari sai com um retrato da tela em vez da logo. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <meta name="apple-mobile-web-app-title" content="SabatinaQuest">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Space Grotesk carrega só os pesos 500/700: é fonte de NÚMERO (XP,
         ofensiva, tempo, posição), não de texto corrido. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,700;0,800;0,900;1,700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
